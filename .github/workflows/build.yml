name: build-ios

on:
  # 只在需要单独验证无签名产物时手动跑；日常出包走 build-signed.yml（推送 main 即触发），
  # 避免两个 workflow 抢 macOS 队列容量
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      # 无签名真机构建（Windows 上无法编译 iOS，借 macOS runner 出二进制）
      - name: Build (device, unsigned)
        run: |
          xcodebuild -project AdasIOS.xcodeproj -scheme AdasIOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/AdasIOS.app
          ls -la "$(dirname "$APP")"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry AdasIOS-unsigned.ipa Payload
          ls -lh AdasIOS-unsigned.ipa

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdasIOS-unsigned-ipa
          path: AdasIOS-unsigned.ipa
          if-no-files-found: error

      # 模型数值校验：Core ML vs ONNX，跑挂了只告警，不阻塞 IPA 产出
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Core ML model numerically (vs ONNX)
        continue-on-error: true
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet coremltools onnxruntime pillow numpy
          python tools/validate_model.py

  # 有签名证书时的本地打包（见 README「生成 IPA」一节）：
  #   xcodebuild -project AdasIOS.xcodeproj -scheme AdasIOS -configuration Release \
  #     -destination 'generic/platform=iOS' -allowProvisioningUpdates archive \
  #     -archivePath AdasIOS.xcarchive
  #   xcodebuild -exportArchive -archivePath AdasIOS.xcarchive \
  #     -exportOptionsPlist ExportOptions.plist -exportPath . -allowProvisioningUpdates
